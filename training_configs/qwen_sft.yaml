implementation:
  repository: https://github.com/QwenLM/Qwen2.5-VL
  use_unmodified_official_code: true

model:
  name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
  freeze_vision_encoder: true
  use_fast_processor: true

data:
  train: dataset/train/train_pure100_selective1000_contrast100.jsonl
  validation: dataset/annotations/validation.jsonl
  max_image_pixels: 1003520
  preprocessing_workers: 16

training:
  seed: 807
  num_train_epochs: 3
  auto_find_batch_size: true
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  optimizer: adamw_torch_fused
  learning_rate: 5.0e-5
  lr_scheduler_type: constant_with_warmup
  warmup_ratio: 0.03
  weight_decay: 0.05
  max_grad_norm: 1.0
  bf16: true
  tf32: true
  evaluation_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  early_stopping_patience: 1
